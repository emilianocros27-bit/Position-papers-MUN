name: Validate plugin

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install document dependency
        run: python -m pip install -r plugins/mun-position-paper/requirements.txt
      - name: Validate JSON manifests
        run: |
          python -m json.tool .agents/plugins/marketplace.json >/dev/null
          python -m json.tool plugins/mun-position-paper/plugin.json >/dev/null
          python -m json.tool plugins/mun-position-paper/.codex-plugin/plugin.json >/dev/null
      - name: Run document builder smoke test
        run: |
          python plugins/mun-position-paper/tests/test_builder.py
          python plugins/mun-position-paper/tests/test_chat_prompt.py
